name: Release Artifacts
on:
  release:
    types: [published]
env:
  REGISTRY: ghcr.io
jobs:
  # build and publish docker images
  docker:
    strategy:
      matrix:
        image:
          - context: .
            dockerfile: Dockerfile
            name: worker
          - context: .
            dockerfile: Dockerfile
            name: proxy
          - context: .
            dockerfile: Dockerfile
            name: agent
          - context: ./ui
            dockerfile: ./ui/Dockerfile
            name: web-ui
    runs-on: ubuntu-latest
    steps:
      - name: Set build date
        id: date
        run: echo "::set-output name=date::$(date -Is -u)"
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/isstech/chorus-${{ matrix.image.name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/isstech/chorus-${{ matrix.image.name }}:latest
          build-args: |
            BUILD_DATE=${{ steps.date.outputs.date }}
            GIT_TAG=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            SERVICE=${{ matrix.image.name }}
  # publish github Release
  release:
    needs: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.24"
      - name: Install zip
        uses: montudor/action-zip@v1
      - name: Build standalone binaries
        run: |
          mkdir standalone
          platforms=("darwin/amd64" "darwin/arm64" "linux/386" "linux/amd64" "linux/arm64" "windows/amd64" "windows/386" )
          for platform in "${platforms[@]}"
          do
              platform_split=(${platform//\// })
              GOOS=${platform_split[0]}
              GOARCH=${platform_split[1]}
              bin_name='chorus'
              output_name='standalone_'${{ github.ref_name }}'_'$GOOS'_'$GOARCH
              if [ $GOOS = "windows" ]; then
                  bin_name+='.exe'
                  output_name+='.zip'
              else
                  output_name+='.tar.gz'
              fi
              env GOOS=$GOOS GOARCH=$GOARCH go build -o $bin_name ./cmd/chorus
              if [ $? -ne 0 ]; then
                  echo 'An error has occurred! Aborting the script execution...'
                  exit 1
              fi
              if [ $GOOS = "windows" ]; then
                  zip -r standalone/$output_name ./$bin_name
              else
                  tar -cvzf standalone/$output_name ./$bin_name
              fi
              rm ./$bin_name
          done

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          version: v1.25.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BREW_RELEASE_TOKEN: ${{ secrets.BREW_RELEASE_TOKEN }}
